# Cairn — authenticated reverse proxy.
#
# Cairn itself has NO authentication: an unauthenticated POST /projects starts a 
# process on this host with the operator's full permissions. This proxy is the only
# thing standing between the internet and that capability. Do not remove it.
server {
    listen 127.0.0.1:8001;
    server_name evolve.feeltheagi.co.ke;

    # hard cap on request size — the API takes small JSON documents only
    client_max_body_size 256k;

    auth_basic           "Cairn";
    auth_basic_user_file /etc/nginx/cairn/.htpasswd;

    # no indexing, no directory listing
    autoindex off;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # SSE / long polls must stream
    }
}
