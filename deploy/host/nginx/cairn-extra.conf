# Artex is protected by Basic Auth before the app's own login screen.
server {
    listen 127.0.0.1:8002;
    server_name extra.feeltheagi.co.ke;

    client_max_body_size 25m;
    autoindex off;
    server_tokens off;

    auth_basic           "Artex";
    auth_basic_user_file /etc/nginx/cairn/artex.htpasswd;

    # The Artex app has its own JWT auth. Do not re-challenge API calls with
    # Basic auth: browsers do not reliably cache Basic credentials for fetch().
    location ^~ /api/ {
        auth_basic off;
        proxy_pass http://100.119.76.110:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://100.119.76.110:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
